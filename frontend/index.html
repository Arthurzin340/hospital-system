<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Hospitalar</title>
  <link rel="stylesheet" href="css/style.css">
</head>
 
<body>
  <div class="container-index">
    <h2>🏥 Sistema Hospitalar</h2>
    <input id="usuario" placeholder="Usuário">
    <input id="senha" type="password" placeholder="Senha">
    <button onclick="login()">Entrar</button>
  </div>
 
  <script>
    function login() {
      fetch("http://localhost:3000/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          usuario: document.getElementById('usuario').value,
          senha: document.getElementById('senha').value
        })
      })
        .then(r => r.json())
        .then(data => {
          if (data.tipo === "triagem") location.href = "triagem.html";
          else if (data.tipo === "medico") location.href = "medico.html";
          else if (data.tipo === "atendimento") location.href = "atendimento.html";
          else alert("Usuário ou senha inválidos");
        })
        .catch(err => {
          console.error(err);
          alert("Erro ao conectar com o servidor.");
        });
    }
 
    // Atalho secreto: Ctrl + Alt + A abre o painel admin
    window.addEventListener('keydown', function (e) {
      if (e.ctrlKey && e.altKey && (e.key === 'a' || e.key === 'A')) {
        e.preventDefault();
        window.location.href = 'admin.html';
      }
    });
  </script>
</body>
 
</html>
