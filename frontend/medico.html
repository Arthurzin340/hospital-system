<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Médico</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { font-family: Arial, sans-serif; background: #fbe1e1; margin: 0; padding: 20px; }
    .container { width: 90%; max-width: 900px; margin: 20px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 2px 5px 20px rgba(0,0,0,0.1); }
    .btn-abrir-tv { background: #17a2b8; color: white; padding: 8px 16px; border-radius: 5px; font-size: 14px; cursor: pointer; border: none; font-weight: bold; }
    .btn-abrir-tv:hover { background: #117a8b; }
    .consultorio-input { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; background: #f0f4ff; padding: 12px 16px; border-radius: 8px; border: 1px solid #d0d8f0; }
    .consultorio-input label { font-weight: bold; }
    .consultorio-input input { width: 60px; text-align: center; font-size: 18px; font-weight: bold; padding: 4px; border-radius: 4px; border: 1px solid #ccc; }
    input, select, textarea, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; }
    textarea { min-height: 100px; resize: none; }
    button { background: #e0692a; color: white; border: none; cursor: pointer; font-weight: bold; }
    button:hover { background: #c4561b; }
    .card { border: 1px solid #ddd; padding: 15px; margin: 15px 0; border-radius: 10px; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .verde { background: #2ecc71; color: white; padding: 5px 10px; border-radius: 6px; display: inline-block; }
    .amarelo { background: #f1c40f; padding: 5px 10px; border-radius: 6px; display: inline-block; }
    .vermelho { background: #e74c3c; color: white; padding: 5px 10px; border-radius: 6px; display: inline-block; }
  </style>
</head>
<body>
<div class="container">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <h2>🩺 Painel Médico</h2>
    <button class="btn-abrir-tv" onclick="window.open('tv.html', '_blank')">📺 Abrir Tela da TV</button>
  </div>

  <div class="consultorio-input">
    <label>Meu Consultório:</label>
    <input type="text" id="consultorio-num" value="01">
    <span style="color: #666; font-size: 13px;">Este número será exibido na TV ao chamar o paciente.</span> 
  </div>

  <div id="triagens"></div>
  <hr>

  <h3>Consulta</h3>
  <input id="paciente" placeholder="Paciente" readonly>
  <input id="diagnostico" placeholder="Diagnóstico">
  
  <select id="medicacao">
    <option value="">Selecione a medicação</option>
  </select>

  <textarea id="obs" placeholder="Observações"></textarea>
  <button onclick="salvar()">Salvar Consulta</button>
</div>

<script>
let triagensCarregadas = [];

function carregar() {
  fetch("/triagens")
    .then(r => r.json())
    .then(data => {
      triagensCarregadas = data;
      const div = document.getElementById("triagens");
      div.innerHTML = "";

      if (data.length === 0) {
        div.innerHTML = "<p style='color: #666; text-align: center;'>Nenhum paciente aguardando atendimento médico.</p>";
        return;
      }

      data.forEach((t, index) => {
        div.innerHTML += `
          <div class="card">
            <h3>${t.nome}</h3>
            <p><b>Sintoma:</b> ${t.sintoma || "Não informado"}</p>
            <p><b>Temperatura:</b> ${t.temperatura || "Não informada"}°C</p>
            <p><span class="${t.risco}">${t.risco}</span></p>
            <p><b>Alergia:</b> ${t.alergia || "Nenhuma"}</p>
            <p><b>Observação:</b> ${t.observacao || "Nenhuma"}</p>
            <button onclick="selecionar(${index})">Atender</button>
          </div>
        `;
      });
    });
}

function selecionar(index) {
  const t = triagensCarregadas[index];
  document.getElementById("paciente").value = t.nome;
  document.getElementById("obs").value = t.observacao || "";

  if (t.alergia && t.alergia !== "Nenhuma") {
    alert("⚠️ Paciente possui alergia: " + t.alergia);
  }
}

function carregarMedicacoes() {
  fetch("/lista-medicacoes")
    .then(r => r.json())
    .then(data => {
      const select = document.getElementById("medicacao");
      select.innerHTML = `<option value="">Selecione a medicação</option>`;
      data.forEach(med => {
        const option = document.createElement("option");
        option.value = med;
        option.textContent = med;
        select.appendChild(option);
      });
    });
}

function salvar() {
  const paciente = document.getElementById("paciente").value;
  const diagnostico = document.getElementById("diagnostico").value;
  const medicacao = document.getElementById("medicacao").value;
  const obs = document.getElementById("obs").value;

  if (!paciente) { alert("Selecione um paciente clicando em Atender."); return; }
  if (!medicacao) { alert("Selecione uma medicação."); return; }

  fetch("/consulta", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ paciente, diagnostico, medicacao, obs })
  })
  .then(r => r.json())
  .then(() => {
    alert("Consulta salva com sucesso!");
    document.getElementById("paciente").value = "";
    document.getElementById("diagnostico").value = "";
    document.getElementById("medicacao").value = "";
    document.getElementById("obs").value = "";
    carregar();
  });
}

carregar();
carregarMedicacoes();
</script>
</body>
</html>
