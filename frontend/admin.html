<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Usuário</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <a href="index.html"
            style="text-decoration: none; color: #3498db; font-size: 14px; display: inline-block; margin-bottom: 12px;">Voltar
            para login</a>
        <h2>Cadastrar Usuário</h2>

        <form id="formUsuario">
            <input type="text" id="usuario" placeholder="Nome de usuário (Login)" required>
            <input type="password" id="senha" placeholder="Senha" required>

            <select id="tipo" required>
                <option value="">Selecione o Setor</option>
                <option value="atendimento">Atendimento</option>
                <option value="triagem">Triagem</option>
                <option value="medico">Médico</option>
            </select>
            <button type="submit">Cadastrar Usuário</button>
        </form>

        <hr style="margin: 25px 0; border: none; border-top: 1px solid #ccc;">
        <h3>Usuários Cadastrados</h3>

        <div id="listaUsuarios"></div>
    </div>

    <script>
        // Mesmo endereço usado no login (index.html)
        const API = 'http://localhost:3000';

        document.getElementById('formUsuario').addEventListener('submit', function (e) {
            e.preventDefault();

            const usuario = document.getElementById('usuario').value;
            const senha = document.getElementById('senha').value;
            const tipo = document.getElementById('tipo').value;

            fetch(`${API}/usuario`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usuario, senha, tipo })
            })
                .then(res => res.json())
                .then(dados => {
                    if (dados.erro) {
                        alert('Erro: ' + dados.erro);
                    } else {
                        alert('Usuário cadastrado com sucesso!');
                        document.getElementById('formUsuario').reset();
                        carregarUsuarios();
                    }
                })
                .catch(err => {
                    console.error(err);
                    alert('Erro ao conectar com o servidor.');
                });
        });

        function carregarUsuarios() {
            fetch(`${API}/usuarios`)
                .then(res => res.json())
                .then(usuarios => {
                    const div = document.getElementById('listaUsuarios');
                    div.innerHTML = '';
                    usuarios.forEach(u => {
                        div.innerHTML += `
                        <div class="card">
                            <b>Usuário: </b> ${u.usuario} |
                            <b>Setor: </b> ${u.tipo}
                        </div>
                    `;
                    });
                })
                .catch(err => console.error('Erro ao carregar usuários:', err));
        }

        carregarUsuarios();
    </script>
</body>

</html>
