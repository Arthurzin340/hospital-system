<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<header class="navbar">
    <div class="nav-brand">
            <div class="logo-icon"></div>
            <div>
                <h1>Hospital Pro - Almoxarifado</h1>
                <span>Gestão de Entrada e Controle de Estoque</span>
            </div>
        <div class="nav-user">
            <span class="user-pill" id="nomeUsuario"> Almoxarifado</span>
        </div>
</header>

<div class="container">
    <div class="alerta-estoque" id="alertaEstoque" style="display: none;">
        <strong>Atenção: </strong> <span id="alertaTexto"></span>
    </div>
    <div class="starts-bar">
        <div class="stat-card">
            <div class="stat-icon purple"></div>
            <div class="stat-value" id="statIrens">-</div>
            <div class="stat-label">Tipos Cadastrados</div>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-icon green">🟢</div>
        <div class="stat-value" id="statOk">-</div>
        <div class="stat-label">Estoque Normal</div>
    </div>
</div>
    
    <div class="stat-card" id="statBaixo">
        <div class="stat-icon orange">🟠<div>
          <div>
              <div class="stat-value" id="statBaixo">-</div>
              <div class="stat-label">Estoque Baico (MENOR QUE 10 UN)</div>
          </div>
    </div>
        <div class="stat-card">
            <div class="stat-icon red">🚫</div>
            </div>
            <div class="stat-value" id="statZerado">-</div>
            <div class="stat-label">Zerado / Esgotado</div>
        </div>
    </div>
</div>

<div class="mais-grid">
    <div>
        <div class="card">
            <div class="card-header">
                <h2>Entrada DE Medicamento</h2>
                </div>

                <div class="card-body">
                    <div class="entrada-tabs">
                        <button class="tab-btnActive" id="tabNovo" onclick="setTab('novo')">➕ Novo Medicamento</button></div>
                        <button class="tab-btn" id="tabRepor" onclick="setTab('repor')">Repor Existente</button>
                </div>

                <div id="painelNovo">
                    <div class="form-group">
                        <label for="emNome">Nome do Medicamneto</label>
                        <input type="text" id="emNome" class="form-control" placeholder="Ex: Paracetamol 750mg" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label for="emQtd">Quantidade
                            <small>(unidades a adicionar)</small></label>
                            <input type="number" id="emQtd" class="form-control" value="10"
                            min="1">
                    </div>
                    <div class="form-group"><label for="emUnidade">Tipo de unidade</label>
                    <select id="emUnidade" class="form-control">
                        <option value="comprimidos">Comprimidos</option>
                        <option value="cápsula">Cápsula</option>
                        <option value="frascoa">Frascoa</option>
                        <option value="ampolas">Ampolas</option>
                        <option value="sachês">Sachês</option>
                        <option value="unidadas">Unidadas</option>
                    </select>
                    </div>
                    <div class="form-group"><label for="emCategoria">Categoria Farmacológica</label>
                        <select id="emCategoria" class="form-group">
                            <option value="Analgésico/Antipirético">
                                Analgésico/
                                Antipirético</option>
                                <option value="Antibiótico">Antibiótico</option>
                                <option value="Anti-inflamatório">Anti-inflamatório</option>
                                <option value="Antialérgico">Antialérgico</option>
                                <option value="Protetor Gástrico">Protetor Gástrico</option>
                                <option value="Antiespasmódico">Antiespasmódico</option>
                                <option value="Antiemético">Antiemético</option>
                                <option value="Solução">Solução</option>
                                <option value="Vitamina/Suplemento">Vitamina / Suplemento</option>
                                <option value="Geral">Geral</option>
                        </select>
                    </div>
                    <button class="btn-full btn-purple" onclick="darEntrada()">Registrar Entrada no Estoque</button>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
